extensions:
  file_storage:
    directory: /var/lib/otelcol
  health_check:
    endpoint: 0.0.0.0:13133
  opamp:
    agent_description:
      include_resource_attributes: true
      non_identifying_attributes:
        cx.agent.type: agent
        cx.cluster.name: 'host-demo'
        cx.deployment.type: 'host'
    server:
      http:
        endpoint: https://ingress.app.staging.coralogix.net/opamp/v1
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
        polling_interval: 2m
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679

processors:
  batch:
    send_batch_max_size: 2048
    send_batch_size: 1024
    timeout: 1s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  probabilistic_sampler:
    mode: proportional
    sampling_percentage: 10
  resource/metadata:
    attributes:
    - action: upsert
      key: cx.agent.type
      value: agent
    - action: upsert
      key: cx.otel_integration.name
      value: coralogix-integration-host
    - action: upsert
      key: cx.deployment.type
      value: host
  resourcedetection/entity:
    detectors:
    - system
    - env
    override: false
    system:
      resource_attributes:
        host.cpu.cache.l2.size:
          enabled: true
        host.cpu.family:
          enabled: true
        host.cpu.model.id:
          enabled: true
        host.cpu.model.name:
          enabled: true
        host.cpu.stepping:
          enabled: true
        host.cpu.vendor.id:
          enabled: true
        host.id:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        os.description:
          enabled: true
    timeout: 2s
  resourcedetection/env:
    detectors:
    - system
    - env
    override: false
    system:
      resource_attributes:
        host.id:
          enabled: true
    timeout: 2s
  resourcedetection/region:
    detectors:
    - gcp
    - ec2
    - azure
    override: true
    timeout: 2s
  transform/entity-event:
    error_mode: silent
    log_statements:
    - context: log
      statements:
      - set(attributes["otel.entity.id"]["host.id"], resource.attributes["host.id"])
      - merge_maps(attributes, resource.attributes, "insert")
    - context: resource
      statements:
      - keep_keys(attributes, [""])
  transform/reduce:
    error_mode: silent
    log_statements:
    - context: resource
      statements:
      - delete_key(attributes, "azure.resourcegroup.name")
      - delete_key(attributes, "azure.vm.name")
      - delete_key(attributes, "azure.vm.scaleset.name")
      - delete_key(attributes, "azure.vm.size")
      - delete_key(attributes, "cloud.account.id")
      - delete_key(attributes, "cloud.availability_zone")
      - delete_key(attributes, "cloud.platform")
      - delete_key(attributes, "cloud.provider")
      - delete_key(attributes, "cloud.region")
      - delete_key(attributes, "container.id")
      - delete_key(attributes, "cx.otel_integration.name")
      - delete_key(attributes, "faas.id")
      - delete_key(attributes, "faas.instance")
      - delete_key(attributes, "faas.name")
      - delete_key(attributes, "faas.version")
      - delete_key(attributes, "gcp.cloud_run.job.execution")
      - delete_key(attributes, "gcp.cloud_run.job.task_index")
      - delete_key(attributes, "gcp.gce.instance_group_manager.name")
      - delete_key(attributes, "gcp.gce.instance_group_manager.region")
      - delete_key(attributes, "gcp.gce.instance_group_manager.zone")
      - delete_key(attributes, "host.image.id")
      - delete_key(attributes, "host.type")
      - delete_key(attributes, "os.type")
      - delete_key(attributes, "os.version")
      - delete_key(attributes, "process.command")
      - delete_key(attributes, "process.command_line")
      - delete_key(attributes, "process.command_args")
      - delete_key(attributes, "process.executable.name")
      - delete_key(attributes, "process.executable.path")
      - delete_key(attributes, "process.owner")
      - delete_key(attributes, "process.pid")
      - delete_key(attributes, "process.parent_pid")
      - delete_key(attributes, "process.runtime.description")
      - delete_key(attributes, "process.runtime.name")
      - delete_key(attributes, "process.runtime.version")
      - delete_key(attributes, "telemetry.distro.name")
      - delete_key(attributes, "telemetry.distro.version")
      - delete_key(attributes, "telemetry.sdk.language")
      - delete_key(attributes, "telemetry.sdk.name")
      - delete_key(attributes, "telemetry.sdk.version")
    metric_statements:
    - context: resource
      statements:
      - delete_key(attributes, "azure.resourcegroup.name")
      - delete_key(attributes, "azure.vm.name")
      - delete_key(attributes, "azure.vm.scaleset.name")
      - delete_key(attributes, "azure.vm.size")
      - delete_key(attributes, "cloud.account.id")
      - delete_key(attributes, "cloud.availability_zone")
      - delete_key(attributes, "cloud.platform")
      - delete_key(attributes, "cloud.provider")
      - delete_key(attributes, "cloud.region")
      - delete_key(attributes, "container.id")
      - delete_key(attributes, "cx.otel_integration.name")
      - delete_key(attributes, "faas.id")
      - delete_key(attributes, "faas.instance")
      - delete_key(attributes, "faas.name")
      - delete_key(attributes, "faas.version")
      - delete_key(attributes, "gcp.cloud_run.job.execution")
      - delete_key(attributes, "gcp.cloud_run.job.task_index")
      - delete_key(attributes, "gcp.gce.instance_group_manager.name")
      - delete_key(attributes, "gcp.gce.instance_group_manager.region")
      - delete_key(attributes, "gcp.gce.instance_group_manager.zone")
      - delete_key(attributes, "host.image.id")
      - delete_key(attributes, "host.type")
      - delete_key(attributes, "os.type")
      - delete_key(attributes, "os.version")
      - delete_key(attributes, "process.command")
      - delete_key(attributes, "process.command_line")
      - delete_key(attributes, "process.command_args")
      - delete_key(attributes, "process.executable.name")
      - delete_key(attributes, "process.executable.path")
      - delete_key(attributes, "process.owner")
      - delete_key(attributes, "process.pid")
      - delete_key(attributes, "process.parent_pid")
      - delete_key(attributes, "process.runtime.description")
      - delete_key(attributes, "process.runtime.name")
      - delete_key(attributes, "process.runtime.version")
      - delete_key(attributes, "net.host.name")
      - delete_key(attributes, "net.host.port")
      - delete_key(attributes, "telemetry.distro.name")
      - delete_key(attributes, "telemetry.distro.version")
      - delete_key(attributes, "telemetry.sdk.language")
      - delete_key(attributes, "telemetry.sdk.name")
      - delete_key(attributes, "telemetry.sdk.version")
    trace_statements:
    - context: resource
      statements:
      - delete_key(attributes, "azure.resourcegroup.name")
      - delete_key(attributes, "azure.vm.name")
      - delete_key(attributes, "azure.vm.scaleset.name")
      - delete_key(attributes, "azure.vm.size")
      - delete_key(attributes, "cloud.account.id")
      - delete_key(attributes, "cloud.availability_zone")
      - delete_key(attributes, "cloud.platform")
      - delete_key(attributes, "cloud.provider")
      - delete_key(attributes, "cloud.region")
      - delete_key(attributes, "container.id")
      - delete_key(attributes, "cx.otel_integration.name")
      - delete_key(attributes, "faas.id")
      - delete_key(attributes, "faas.instance")
      - delete_key(attributes, "faas.name")
      - delete_key(attributes, "faas.version")
      - delete_key(attributes, "gcp.cloud_run.job.execution")
      - delete_key(attributes, "gcp.cloud_run.job.task_index")
      - delete_key(attributes, "gcp.gce.instance_group_manager.name")
      - delete_key(attributes, "gcp.gce.instance_group_manager.region")
      - delete_key(attributes, "gcp.gce.instance_group_manager.zone")
      - delete_key(attributes, "host.image.id")
      - delete_key(attributes, "host.type")
      - delete_key(attributes, "os.type")
      - delete_key(attributes, "os.version")
      - delete_key(attributes, "process.command")
      - delete_key(attributes, "process.command_line")
      - delete_key(attributes, "process.command_args")
      - delete_key(attributes, "process.executable.name")
      - delete_key(attributes, "process.executable.path")
      - delete_key(attributes, "process.owner")
      - delete_key(attributes, "process.pid")
      - delete_key(attributes, "process.parent_pid")
      - delete_key(attributes, "process.runtime.description")
      - delete_key(attributes, "process.runtime.name")
      - delete_key(attributes, "process.runtime.version")
  transform/reduce_log_attributes:
    error_mode: silent
    log_statements:
    - context: log
      statements:
      - delete_key(attributes, "log.iostream")
      - delete_key(attributes, "log.file.path")
      - delete_key(attributes, "logtag")
      - delete_key(attributes, "time")
  transform/semconv:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - set(attributes["http.method"], attributes["http.request.method"]) where attributes["http.request.method"] != nil

receivers:
  filelog:
    exclude: []
    force_flush_period: 0
    include:
    - /var/log/*.log
    - /var/log/syslog
    - /var/log/auth.log
    - /var/log/kern.log
    - /var/log/messages
    include_file_name: false
    include_file_path: true
    operators:
    - id: get-format
      routes:
      - expr: body matches "^\\{"
        output: parser-json
      - expr: body matches "^[^ ]+ [0-9]+ [0-9]+:[0-9]+:[0-9]+"
        output: parser-syslog
      type: router
    - id: parser-json
      timestamp:
        layout: '%Y-%m-%dT%H:%M:%S.%LZ'
        parse_from: attributes.time
      type: json_parser
    - id: parser-syslog
      regex: ^(?P<timestamp>[^ ]+ [0-9]+ [0-9]+:[0-9]+:[0-9]+) (?P<hostname>[^ ]+) (?P<program>[^:]+): (?P<message>.*)$
      timestamp:
        layout: 'Jan 2 15:04:05'
        parse_from: attributes.timestamp
      type: regex_parser
    - field: attributes.message
      id: handle_empty_log
      if: attributes.message == nil
      type: add
      value: ""
    - from: attributes.program
      to: resource["service.name"]
      type: move
    - from: attributes.hostname
      to: resource["host.name"]
      type: move
    - from: attributes.message
      id: clean-up-log-record
      to: body
      type: move
    - default: export
      type: router
    retry_on_failure:
      enabled: true
    start_at: beginning
    storage: file_storage
  hostmetrics:
    collection_interval: '30s'
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: null
      filesystem:
        exclude_fs_types:
          fs_types:
          - autofs
          - binfmt_misc
          - bpf
          - cgroup2
          - configfs
          - debugfs
          - devpts
          - devtmpfs
          - fusectl
          - hugetlbfs
          - iso9660
          - mqueue
          - nsfs
          - overlay
          - proc
          - procfs
          - pstore
          - rpc_pipefs
          - securityfs
          - selinuxfs
          - squashfs
          - sysfs
          - tracefs
          match_type: strict
        exclude_mount_points:
          match_type: regexp
          mount_points:
          - /dev/*
          - /proc/*
          - /sys/*
          - /snap/*
      load: null
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: null
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true
          process.threads:
            enabled: true
        mute_process_exe_error: true
        mute_process_name_error: true
        mute_process_user_error: true
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 20
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: '30s'
        static_configs:
        - targets:
          - localhost:8888
  statsd:
    endpoint: 0.0.0.0:8125
  zipkin:
    endpoint: 0.0.0.0:9411

exporters:
  coralogix:
    application_name: otel-demo
    application_name_attributes:
    - service.namespace
    domain: app.staging.coralogix.net
    logs:
      headers:
        X-Coralogix-Distribution: host-otel-integration/1.0.0
    metrics:
      headers:
        X-Coralogix-Distribution: host-otel-integration/1.0.0
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    profiles:
      headers:
        X-Coralogix-Distribution: host-otel-integration/1.0.0
    subsystem_name: integration
    subsystem_name_attributes:
    - service.name
    timeout: 30s
    traces:
      headers:
        X-Coralogix-Distribution: host-otel-integration/1.0.0
  coralogix/resource_catalog:
    application_name: resource
    domain: app.staging.coralogix.net
    logs:
      headers:
        X-Coralogix-Distribution: host-otel-integration/1.0.0
        x-coralogix-ingress: metadata-as-otlp-logs/v1
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    subsystem_name: catalog
    timeout: 30s
  debug: {}

connectors:
  forward/db: {}
  forward/sampled: {}
  spanmetrics:
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: http.method
    - name: cgx.transaction
    - name: cgx.transaction.root
    - name: status_code
    - name: db.namespace
    - name: db.operation.name
    - name: db.collection.name
    - name: db.system
    - name: http.response.status_code
    - name: rpc.grpc.status_code
    - name: service.version
    histogram:
      explicit:
        buckets:
        - 1ms
        - 4ms
        - 10ms
        - 20ms
        - 50ms
        - 100ms
        - 200ms
        - 500ms
        - 1s
        - 2s
        - 5s
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: ""
  spanmetrics/db:
    aggregation_cardinality_limit: 100000
    dimensions:
    - name: db.namespace
    - name: db.operation.name
    - name: db.collection.name
    - name: db.system
    - name: service.version
    histogram:
      explicit:
        buckets:
        - 100us
        - 1ms
        - 2ms
        - 2.5ms
        - 4ms
        - 6ms
        - 10ms
        - 100ms
        - 250ms
    metrics_expiration: 5m
    metrics_flush_interval: '30s'
    namespace: db

service:
  extensions:
  - health_check
  - file_storage
  - opamp
  - zpages
  - pprof
  pipelines:
    logs:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resource/metadata
      - resourcedetection/region
      - resourcedetection/env
      - transform/reduce_log_attributes
      - transform/reduce
      - batch
      receivers:
      - filelog
      - otlp
    logs/resource_catalog:
      exporters:
      - coralogix/resource_catalog
      processors:
      - memory_limiter
      - resource/metadata
      - resourcedetection/entity
      - transform/entity-event
      receivers:
      - hostmetrics
    metrics:
      exporters:
      - coralogix
      processors:
      - memory_limiter
      - resource/metadata
      - resourcedetection/region
      - resourcedetection/env
      - transform/reduce
      - batch
      receivers:
      - hostmetrics
      - spanmetrics
      - spanmetrics/db
      - prometheus
      - otlp
      - statsd
    traces:
      exporters:
      - spanmetrics
      - forward/db
      - forward/sampled
      processors:
      - memory_limiter
      - resource/metadata
      - resourcedetection/region
      - resourcedetection/env
      - transform/reduce
      - transform/semconv
      - batch
      receivers:
      - jaeger
      - zipkin
      - otlp
    traces/db:
      exporters:
      - spanmetrics/db
      processors:
      - batch
      receivers:
      - forward/db
    traces/sampled:
      exporters:
      - coralogix
      processors:
      - batch
      - probabilistic_sampler
      receivers:
      - forward/sampled
  telemetry:
    logs:
      encoding: json
      level: 'info'
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: localhost
              port: 8888
    resource:
      cx.agent.type: agent
      service.name: opentelemetry-collector
