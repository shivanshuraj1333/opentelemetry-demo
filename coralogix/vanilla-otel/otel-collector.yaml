receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832
  zipkin:
    endpoint: 0.0.0.0:9411
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-demo'
          static_configs:
            - targets: ['localhost:9090']
  hostmetrics:
    root_path: /hostfs
    scrapers:
      cpu:
      disk:
      memory:
      network:
      processes:
      filesystem:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: jaeger:14250
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"

processors:
  batch:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resourcedetection:
    detectors: [env, system]
  attributes:
    actions:
      - key: "service.name"
        action: upsert
        from_attribute: "service.name"

service:
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [resourcedetection, memory_limiter, attributes, batch]
      exporters: [otlp, debug]
    metrics:
      receivers: [hostmetrics, prometheus, otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [debug]
  telemetry:
    metrics:
      level: detailed
      readers:
        - periodic:
            interval: 10000
            timeout: 5000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4318